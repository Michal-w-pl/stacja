name: Stacja pogody

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # co 15 minut, poza godzinami szczytu
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego uruchomienia
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Czcionki
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Biblioteki
        run: pip install -r requirements.txt

      - name: Generowanie obrazka
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python generate.py --out "public/${{ secrets.IMAGE_NAME || 'stacja' }}.png"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
